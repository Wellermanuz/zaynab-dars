<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Interaktiv dars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EC;--card:#fff;--ink:#1E1B2E;--muted:#6F6A80;--line:#E8E3F3;--soft:#EFEBFE;--pri:#5B47E0;--pri2:#3F2FB0;--r:#E5484D;--b:#2F7CF6;--y:#E39B00;--g:#1F9D55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px 300px at 110% -5%,#E3DCFF 0,transparent 70%),radial-gradient(500px 300px at -20% 105%,#FBE3CF 0,transparent 70%)}
#net{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--r);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:7px;display:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px 32px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
h1{font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.02em}
h2{font-weight:800;font-size:20px;letter-spacing:-.01em}
.muted{color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 1px 0 rgba(30,27,46,.04),0 8px 24px rgba(30,27,46,.06)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:15px 18px;font:800 17px Manrope,sans-serif;color:#fff;background:var(--pri);box-shadow:0 4px 0 var(--pri2);cursor:pointer;width:100%;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:#fff;color:var(--pri);box-shadow:none;border:2px solid var(--line)}
.btn.green{background:var(--g);box-shadow:0 4px 0 #167A41}
.btn.sm{padding:9px 13px;font-size:14px;width:auto;border-radius:12px}
.link{background:none;border:0;color:var(--pri);font:700 14px Manrope,sans-serif;cursor:pointer;padding:6px;text-decoration:underline}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:15px;font:700 18px Manrope,sans-serif;color:var(--ink);outline:none;background:#fff}
.field:focus{border-color:var(--pri)}
.err{color:var(--r);font-weight:800;font-size:14px;text-align:center;min-height:18px}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.08)}}
.pop{animation:pop .3s cubic-bezier(.3,1.4,.6,1) both}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--pri2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.count{font-size:56px;font-weight:800;color:var(--pri);line-height:1;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.me{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip .x{border:0;background:#F3F0FA;color:var(--muted);width:20px;height:20px;border-radius:50%;font-weight:800;cursor:pointer;line-height:20px;padding:0}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#6B57F0,#3F2FB0);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;box-shadow:0 10px 24px rgba(91,71,224,.35)}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--pri);animation:blink 1.4s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.sec{font-weight:800;font-size:12px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.game{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left;font:800 15px Manrope,sans-serif;color:var(--ink);cursor:pointer;line-height:1.25}
.game .ic{font-size:26px;display:block;margin-bottom:6px}
.game small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:4px}
.game .tag{display:inline-block;font-size:11px;background:var(--soft);color:var(--pri2);border-radius:99px;padding:2px 8px;margin-top:6px;font-weight:800}
.game.sel{border-color:var(--pri);background:#F7F5FF;box-shadow:0 0 0 3px #DCD5FF}
.qhead{display:flex;align-items:center;justify-content:space-between}
.timer{width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 var(--pri2)}
.timer.low{background:var(--r);box-shadow:0 4px 0 #B0303A;animation:pulse .6s infinite}
.qtext{font-size:22px;font-weight:800;line-height:1.3}
.qtext.long{font-size:18px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{position:relative;border:0;border-radius:16px;min-height:58px;color:#fff;font:700 16px Manrope,sans-serif;display:flex;align-items:center;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;padding:12px 46px 12px 54px;line-height:1.3;transition:transform .08s,opacity .2s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.opt .shape{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800;font-size:15px}
.opt .cnt{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:800;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 9px}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{min-height:110px;justify-content:center;text-align:center;font-size:20px;font-weight:800;padding:12px;flex-direction:column;gap:6px}
.opts.tf .opt .shape{position:static;transform:none;width:40px;height:40px;font-size:20px}
.opts.tf .opt .cnt{top:10px;transform:none}
.o0{background:var(--r)}.o1{background:var(--b)}.o2{background:var(--y)}.o3{background:var(--g)}
.tf .o0{background:var(--g)}.tf .o1{background:var(--r)}
.opt.dim{opacity:.3}
.opt.right{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--g)}
.opt.mine:after{content:'Siz';position:absolute;right:12px;bottom:-9px;background:#fff;color:var(--ink);font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bar{height:10px;background:#EEEAF6;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .4s}
.lb{display:flex;flex-direction:column;gap:8px}
.lbrow{display:flex;align-items:center;gap:10px;background:#F8F7FB;border-radius:12px;padding:10px 12px;font-weight:700}
.lbrow .n{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.lbrow .s{margin-left:auto;color:var(--pri2);font-weight:800}
.lbrow.me{background:var(--soft)}
.prow{background:#F8F7FB;border-radius:12px;padding:10px 12px;font-weight:700}
.prow .bar{margin-top:6px;height:8px}
.off{opacity:.45}
.result{border-radius:22px;padding:26px 18px;color:#fff;text-align:center}
.result.ok{background:var(--g)}.result.no{background:var(--r)}.result.wait{background:var(--pri)}
.result .big{font-size:64px;line-height:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:6px}
.pod{flex:1;max-width:130px;text-align:center;font-weight:800;font-size:14px}
.pod .blk{border-radius:14px 14px 6px 6px;color:#fff;display:grid;place-items:center;font-size:26px;margin-top:6px}
.p1 .blk{height:120px;background:#E3A400}.p2 .blk{height:88px;background:#98A2B3}.p3 .blk{height:64px;background:#C2793F}
.hint{font-size:13px;color:var(--muted);font-weight:600;text-align:center;line-height:1.45}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}
.tiny{font-size:12px}
/* saralash */
.sortitem{font-size:20px;font-weight:800;text-align:center;padding:26px 16px;min-height:140px;display:grid;place-items:center;line-height:1.35;transition:background .2s}
.sortitem.ok{background:#E3F6EA}.sortitem.no{background:#FCE6E7;animation:shake .3s}
.sortitem .fb{font-size:16px;margin-top:10px}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bucket{border:0;border-radius:18px;padding:16px 10px;font:800 17px Manrope,sans-serif;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.bucket .bi{font-size:36px;display:block;margin-bottom:4px}
.b0{background:#F07A2E}.b1{background:var(--b)}
/* juftlik */
.match{display:grid;grid-template-columns:.85fr 1.15fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:700 14px Manrope,sans-serif;color:var(--ink);text-align:left;cursor:pointer;min-height:58px;line-height:1.3}
.mcol:first-child .mi{background:#F7F5FF;font-weight:800}
.mi.sel{border-color:var(--pri);box-shadow:0 0 0 3px #DCD5FF}
.mi.ok{border-color:var(--g);background:#E3F6EA;color:#167A41;pointer-events:none;opacity:.7}
.mi.bad{border-color:var(--r);background:#FCE6E7;animation:shake .3s}
/* krossvord */
.cw{display:grid;gap:2px;width:100%;margin:0 auto}
.cwc{position:relative;aspect-ratio:1}
.cwc.x{visibility:hidden}
.cwc input,.cwc .cell{width:100%;height:100%;border:2px solid #D6CFF5;border-radius:4px;padding:0;text-align:center;font:800 clamp(12px,3.6vw,18px) Manrope,sans-serif;text-transform:uppercase;background:#fff;color:var(--ink);outline:none;display:grid;place-items:center;caret-color:transparent}
.cwc input:focus{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.cwc input.hl{background:#ECE7FF}
.cwc input.ok,.cwc .cell.ok{background:#DDF4E6;border-color:var(--g);color:#167A41}
.cwc input.bad{background:#FCE6E7;border-color:var(--r);animation:shake .3s}
.cwc .num{position:absolute;top:1px;left:3px;font-size:8px;font-weight:800;color:var(--muted);pointer-events:none;z-index:1}
.clues{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:600}
.clue{padding:7px 9px;border-radius:10px;cursor:pointer;line-height:1.35}
.clue b{color:var(--pri2)}
.clue.act{background:var(--soft)}
.clue.ok{color:var(--g);text-decoration:line-through}
/* ketma-ketlik */
.olist{display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font:700 15px Manrope,sans-serif;color:var(--ink);text-align:left;cursor:pointer;line-height:1.3;width:100%}
.oitem .on{width:26px;height:26px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.oitem.pool .on{background:#EEEAF6;color:var(--muted)}
.oitem.ok{border-color:var(--g);background:#E3F6EA}.oitem.ok .on{background:var(--g)}
.oitem.no{border-color:var(--r);background:#FCE6E7}.oitem.no .on{background:var(--r)}
.oitem.static{cursor:default}
.slot{border:2px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-weight:700;font-size:14px;text-align:center}
/* keys */
.casetxt{font-size:17px;font-weight:600;line-height:1.55}
.grp{border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(30,27,46,.06)}
.grp .gh{color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.grp .gb{padding:12px 14px}
.grp.win{box-shadow:0 0 0 4px var(--y),0 8px 24px rgba(30,27,46,.06)}
.ans{background:#F8F7FB;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin-top:8px;line-height:1.45}
.ans b{color:var(--pri2)}
textarea.field{min-height:130px;resize:vertical;font-size:16px;font-weight:600;line-height:1.45}
.task{border-left:4px solid var(--pri);padding:2px 0 2px 12px;font-weight:700;line-height:1.5}
/* so'z buluti */
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;min-height:160px;padding:10px 0}
.cloud span{font-weight:800;line-height:1.1;animation:pop .3s both}
</style>
</head>
<body>
<div class="deco"></div>
<div id="net">Aloqa uzildi — qayta ulanmoqda…</div>
<div id="app"></div>
<script>
/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor('#F4F1EC'); tg.setBackgroundColor('#F4F1EC'); } catch (e) {}
const haptic = (t) => { try { tg.HapticFeedback.impactOccurred(t || 'medium'); } catch (e) {} };
const tgUser = (() => { try { return tg.initDataUnsafe.user || null; } catch (e) { return null; } })();

/* ================= Yordamchilar ================= */
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const $ = (s) => document.querySelector(s);
const app = $('#app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isTeacherName = (n) => /^(zaynab|зайнаб)(\s|$)/i.test(String(n || '').trim());
const TYPE_LABEL = { quiz: 'Viktorina', case: 'Guruh keysi', cw: 'Krossvord', match: 'Juftlik', sort: 'Saralash', order: 'Ketma-ketlik', cloud: "So'z buluti" };
const LETTERS = ['A', 'B', 'C', 'D'];
function myId() {
  if (tgUser && tgUser.id) return 'tg' + tgUser.id;
  let id = LS.get('zd_id'); if (!id) { id = 'w' + Math.random().toString(36).slice(2, 12); LS.set('zd_id', id); }
  return id;
}
const me = { id: myId(), name: '', role: null, pass: '', asStudent: false };
let S = null, la = null, deadline = 0, loginErr = '', busy = false, showKey = false, lastKey = '';

/* ================= Server bilan aloqa ================= */
const socket = io({ transports: ['websocket', 'polling'], reconnectionDelayMax: 4000 });
function netBar() {
  $('#net').style.display = (!socket.connected && me.role) ? 'block' : 'none';
  const c = $('#cstat'); if (c) c.textContent = socket.connected ? '' : "Serverga ulanmoqda… (birinchi ochilishda 1 daqiqagacha vaqt olishi mumkin)";
}
socket.on('connect', () => {
  netBar();
  if (me.role) socket.emit('login', { id: me.id, name: me.name, pass: me.pass, asStudent: me.asStudent }, (r) => {
    if (!r || !r.ok) { me.role = null; S = null; loginErr = (r && r.err) || ''; render(true); }
  });
});
socket.on('disconnect', netBar);
socket.on('connect_error', netBar);
socket.on('state', (v) => {
  S = v;
  if (S.q && S.phase === 'question') deadline = Date.now() + S.q.left;
  render();
});
socket.on('kicked', () => { me.role = null; S = null; loginErr = "Ustoz sizni xonadan chiqardi. Qayta kirishingiz mumkin."; render(true); });

/* ================= Kirish ================= */
function nameInput() {
  const v = $('#nm').value, t = isTeacherName(v);
  $('#pwbox').style.display = t ? 'flex' : 'none';
  $('#lbtn').textContent = t ? 'Admin sifatida kirish 🔐' : 'Kirish';
  $('#lerr').textContent = '';
}
function doLogin(asStudent) {
  if (busy) return;
  const name = $('#nm').value.trim(), pwEl = $('#pw'), pass = pwEl ? pwEl.value.trim() : '';
  if (!name) { $('#lerr').textContent = 'Ismingizni yozing'; $('#nm').focus(); return; }
  if (isTeacherName(name) && !asStudent && !pass) { $('#lerr').textContent = 'Parolni kiriting'; pwEl.focus(); return; }
  busy = true; $('#lbtn').disabled = true;
  socket.emit('login', { id: me.id, name, pass, asStudent: !!asStudent }, (r) => {
    busy = false; const b = $('#lbtn'); if (b) b.disabled = false;
    if (!r || !r.ok) { $('#lerr').textContent = (r && r.err) || 'Xatolik'; if (r && r.needPass && pwEl) { pwEl.value = ''; pwEl.focus(); } return; }
    haptic('heavy');
    Object.assign(me, { name, role: r.role, pass, asStudent: !!asStudent });
    LS.set('zd_name', name); loginErr = '';
    render(true);
  });
}
function vLogin() {
  const pre = LS.get('zd_name') || (tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : '');
  setTimeout(() => { if ($('#nm')) { nameInput(); if (loginErr) $('#lerr').textContent = loginErr; netBar(); } }, 0);
  return `
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px">
    <div class="brand pop">
      <div class="logo">ZJ</div>
      <div class="center"><h1>Interaktiv dars</h1>
      <p class="muted" style="margin-top:6px">Zaynab Jabbiyeva · Maktabgacha ta'lim</p></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <label class="muted tiny" for="nm" style="font-weight:800;text-transform:uppercase;letter-spacing:.06em">Ism va familiyangiz</label>
      <input id="nm" class="field" maxlength="24" placeholder="Masalan: Dilnoza Karimova" value="${esc(pre)}" oninput="nameInput()" onkeydown="if(event.key==='Enter')doLogin()">
      <div id="pwbox" style="display:none;flex-direction:column;gap:8px">
        <label class="muted tiny" for="pw" style="font-weight:800;text-transform:uppercase;letter-spacing:.06em">🔐 Admin paroli</label>
        <input id="pw" class="field" type="password" inputmode="numeric" maxlength="20" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="link" onclick="doLogin(true)">Men admin emasman — talaba sifatida kirish</button>
      </div>
      <div class="err" id="lerr"></div>
      <button class="btn" id="lbtn" onclick="doLogin()">Kirish</button>
    </div>
    <p class="hint" id="cstat"></p>
  </div>`;
}

/* ================= Ustoz amallari ================= */
const emit = (ev, d) => { haptic('medium'); socket.emit(ev, d || {}); };
const pickGame = (k) => { haptic('light'); socket.emit('pick', { game: k }); };
const toggleKey = () => { showKey = !showKey; render(true); };

/* ================= Umumiy qismlar ================= */
const players = () => S.players;
const online = () => S.players.filter((p) => p.on);
const ranked = () => S.players.slice().sort((a, b) => b.score - a.score);
const meP = () => S.players.find((p) => p.id === S.me);
const isT = () => me.role === 'teacher';
const inGame = () => !['lobby', 'end'].includes(S.phase);
function topBar() {
  const left = isT() ? `<span class="badge">👩‍🏫 Admin · Zaynab</span>` : `<span class="badge">👤 ${esc(me.name)}</span>`;
  const right = isT() && inGame() ? `<button class="btn ghost sm" onclick="emit('end')">Yakunlash</button>`
    : (!isT() && inGame() ? `<span class="badge">${S.gi.icon} ${esc(S.gi.title)}</span>` : '');
  return `<div class="top">${left}${right}</div>`;
}
function leaderboard(n) {
  return `<div class="lb">${ranked().slice(0, n).map((p, i) => `
    <div class="lbrow ${p.id === S.me ? 'me' : ''}"><span class="n">${i + 1}</span>${esc(p.name)}
      ${p.last ? `<span class="tiny" style="color:var(--g);font-weight:800">+${p.last}</span>` : ''}
      <span class="s">${p.score}</span></div>`).join('')}</div>`;
}
function podium() {
  const r = ranked();
  const slot = (p, cls, medal) => p ? `<div class="pod ${cls} pop"><div style="font-size:30px">${medal}</div>${esc(p.name)}<div class="muted tiny">${p.score} ball</div><div class="blk">${cls.slice(1)}</div></div>` : '<div class="pod"></div>';
  return `<div class="podium">${slot(r[1], 'p2', '🥈')}${slot(r[0], 'p1', '🥇')}${slot(r[2], 'p3', '🥉')}</div>`;
}

/* ================= Lobby ================= */
function tLobby() {

/* ================= Viktorina ================= */
function qCard() {
  const q = S.q;
  return `
  <div class="qhead">
    <span class="badge">Savol ${q.i + 1} / ${q.n}</span>
    ${S.phase === 'question' ? `<div class="timer" id="tmr">${Math.ceil(q.left / 1000)}</div>` : '<span class="badge">⏱ Vaqt tugadi</span>'}
  </div>
  <div class="card pop"><div class="qtext ${q.q.length > 70 ? 'long' : ''}">${esc(q.q)}</div></div>`;
}
function optsHTML(mode) {
  const q = S.q, tf = q.opts.length === 2;
  return `<div class="opts ${tf ? 'tf' : ''}">${q.opts.map((o, i) => {
    const cls = mode === 'reveal' ? (i === q.a ? 'right' : 'dim') : '';
    const mine = mode === 'reveal' && S.my && S.my.c === i ? 'mine' : '';
    const sh = tf ? (i === 0 ? '✔' : '✖') : LETTERS[i];
    return `<button class="opt o${i} ${cls} ${mine}" ${mode === 'play' ? `onclick="answer(${i})"` : ''}>
      <span class="shape">${sh}</span>${mode === 'reveal' && S.counts ? `<span class="cnt">${S.counts[i]}</span>` : ''}<span>${esc(o)}</span></button>`;
  }).join('')}</div>`;
}
function answer(i) {
  if (S.my || S.phase !== 'question') return;
  haptic('heavy'); S.my = { c: i };
  socket.emit('answer', { qi: S.q.i, c: i }); render(true);
}
function tQuestion() {

  <div class="card">
    <div class="row between" style="margin-bottom:8px"><b>Javob berdi</b><b>${S.answered} / ${total}</b></div>

}
function tReveal() {

}
function sQuestion() {

  <div class="card center"><p class="muted">Jami ball</p><div class="count" style="margin-top:4px">${p.score}</div><p class="muted" style="margin-top:6px">Siz ${pos}-o'rindasiz</p></div>
  <p class="hint">Admin keyingi savolni ochishini kuting…</p>`;
}

/* ================= Individual o'yinlar (ustoz) ================= */
function cwGridHTML(pub, mode, sol) {
  const cellSet = new Set(pub.cells);
  const okCells = mode === 'play' ? new Set(la.found.flatMap((wi) => pub.words[wi].cells)) : null;
  let h = `<div class="cw" style="grid-template-columns:repeat(${pub.cols},1fr);max-width:${pub.cols * 36}px">`;
  for (let r = 0; r < pub.rows; r++) for (let c = 0; c < pub.cols; c++) {
    const k = r + ',' + c;
    if (!cellSet.has(k)) { h += '<div class="cwc x"></div>'; continue; }
    const n = pub.nums[k] ? `<span class="num">${pub.nums[k]}</span>` : '';
    if (mode === 'play') {
      const ok = okCells.has(k);
      h += `<div class="cwc">${n}<input data-k="${k}" maxlength="2" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" value="${esc(la.val[k] || '')}" class="${ok ? 'ok' : ''}"></div>`;
    } else h += `<div class="cwc">${n}<div class="cell ${sol ? 'ok' : ''}">${sol ? sol.letters[k] : ''}</div></div>`;
  }
  return h + '</div>';
}
function cluesHTML(pub, play) {
  const part = (dir, title) => `<div class="sec" style="margin-top:8px">${title}</div>` + pub.words.map((w, i) => w.dir !== dir ? '' :
    `<div class="clue ${play && la.found.includes(i) ? 'ok' : ''} ${play && la.aw === i ? 'act' : ''}" ${play ? `onclick="cwSelect(${i})"` : ''}><b>${w.n}.</b> ${esc(w.c)} <span class="muted tiny">(${w.len})</span></div>`).join('');
  return part('a', '➡️ Eniga') + part('d', "⬇️ Bo'yiga");
}
function keyHTML() {
  const A = S.act, sol = A.sol; if (!sol) return '';
  if (A.type === 'cw') return '';
  if (A.type === 'match') return `<div class="lb">${sol.map((p) => `<div class="lbrow" style="display:block"><b>${esc(p[0])}</b> — ${esc(p[1])}</div>`).join('')}</div>`;
  if (A.type === 'sort') return `<div class="lb">${sol.items.map((it) => `<div class="lbrow"><span>${esc(it.t)}</span><span class="s">${sol.buckets[it.b].i} ${esc(sol.buckets[it.b].t)}</span></div>`).join('')}</div>`;
  if (A.type === 'order') return sol.map((s) => `<div class="sec">${esc(s.title)}</div><div class="olist">${s.items.map((t, i) => `<div class="oitem static ok"><span class="on">${i + 1}</span>${esc(t)}</div>`).join('')}</div>`).join('');
  return '';
}
function tActivity() {
  const A = S.act, total = A.total, on = online();
  const rows = ranked().map((p) => {
    const pr = A.prog[p.id] || { solved: 0, n: 0 };
    return `<div class="prow ${p.on ? '' : 'off'}"><div class="row between"><span>${esc(p.name)} ${pr.done ? `<span class="badge" style="padding:2px 8px">🏁 ${pr.rank}-o'rin · ${pr.sec}s</span>` : ''}</span><span style="color:var(--pri2);font-weight:800">${pr.solved}/${total}</span></div>
      <div class="bar"><i style="width:${(pr.n || 0) / total * 100}%"></i></div></div>`;
  }).join('');
  const done = Object.values(A.prog).filter((p) => p.done).length;
  let extra = '';
  if (A.type === 'cw') extra = `<div class="card" style="padding:12px">${cwGridHTML(A.pub, 'show', showKey ? A.sol : null)}<div class="clues" style="margin-top:6px">${cluesHTML(A.pub, false)}</div></div>`;
  else if (showKey) extra = `<div class="card"><h2 style="margin-bottom:6px">🔑 To'g'ri javoblar</h2>${keyHTML()}</div>`;
  return `
  ${topBar()}
  <div class="card center pop">
    <div style="font-size:44px">${S.gi.icon}</div>
    <h2 style="margin-top:4px">${esc(S.gi.title)}</h2>
    <p class="muted" style="margin-top:4px">Har kim o'z telefonida ishlamoqda</p>
  </div>
  <div class="card">
    <div class="row between" style="margin-bottom:10px"><h2>📊 Jarayon</h2><span class="badge">🏁 ${done} / ${on.length} tugatdi</span></div>
    <div class="lb">${rows || '<p class="muted">Hali hech kim boshlamadi</p>'}</div>
  </div>
  <button class="btn ghost" onclick="toggleKey()">${showKey ? '🙈 Javoblarni yashirish' : "🔑 Javoblarni ko'rsatish"}</button>
  ${extra}
  <button class="btn green" onclick="emit('end')">Natijalar 🏆</button>`;
}

/* ================= Individual o'yinlar (talaba) ================= */
function initLa() {
  const A = S.act, m = A.mine || {};
  la = { key: A.key, type: A.type, total: A.total, solved: m.solved || 0, done: !!m.done, rank: m.rank, mist: m.mist || 0, busy: false };
  if (A.type === 'cw') {
    la.val = {}; la.found = []; la.aw = 0; la.cellWords = {}; la.pending = {}; la.tried = {};
    A.pub.words.forEach((w, i) => w.cells.forEach((k) => (la.cellWords[k] = la.cellWords[k] || []).push(i)));
    (m.found || []).forEach(([wi, word]) => { la.found.push(wi); A.pub.words[wi].cells.forEach((k, j) => { la.val[k] = word[j]; }); });
  }
  if (A.type === 'match') { la.okL = (m.matched || []).map((x) => x[0]); la.okR = (m.matched || []).map((x) => x[1]); la.sl = -1; la.sr = -1; la.bad = null; }
  if (A.type === 'sort') { la.sorted = m.sorted || {}; la.fb = null; la.cur = -1; }
  if (A.type === 'order') { la.res = m.order || {}; la.pick = []; la.si = 0; while (la.res[la.si] && la.si < A.pub.seqs.length - 1) la.si++; if (la.done) la.si = A.pub.seqs.length; }
}
function actHead() {
  return `${topBar()}<div class="row between"><h2>${S.gi.icon} ${esc(S.gi.title)}</h2><span class="badge" id="cnt">${la.solved} / ${la.total}</span></div>`;
}
const updCount = () => { const c = $('#cnt'); if (c) c.textContent = `${la.solved} / ${la.total}`; };
function doneCard(extra) {
  return `<div class="result ok pop"><div class="big">🏁</div><h1 style="margin-top:8px">Tayyor!</h1>
    <p style="font-size:17px;font-weight:800;margin-top:8px">${extra || ''}</p>
    <p style="font-weight:700;opacity:.9;margin-top:6px">${la.rank ? la.rank + "-bo'lib tugatdingiz" : ''}</p></div>
    <p class="hint">Admin natijalarni ochishini kuting…</p>`;
}
/* krossvord */
function vCW() {
  if (la.done) return actHead() + doneCard(`Barcha ${la.total} ta so'zni topdingiz!`);
  return `${actHead()}
  <p class="muted center tiny">Katakni bosing va harf yozing. Savolni bossangiz — o'sha so'zga o'tadi.</p>
  <div class="card" style="padding:8px">${cwGridHTML(S.act.pub, 'play')}</div>
  <div class="card" style="padding:12px"><div class="clues" id="clues">${cluesHTML(S.act.pub, true)}</div></div>`;
}
function cwHL() {
  const pub = S.act.pub, act = pub.words[la.aw];
  const okCells = new Set(la.found.flatMap((i) => pub.words[i].cells));
  app.querySelectorAll('.cwc input').forEach((el) => {
    const k = el.dataset.k;
    el.classList.toggle('hl', act.cells.includes(k));
    el.classList.toggle('ok', okCells.has(k));
  });
  const cl = $('#clues'); if (cl) cl.innerHTML = cluesHTML(pub, true);
  updCount();
}
function cwFlash(cells) {
  cells.forEach((k) => { const el = app.querySelector(`input[data-k="${k}"]`); if (el) { el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 700); } });
  haptic('light');
}
function cwTry(k) {
  const pub = S.act.pub;
  for (const wi of la.cellWords[k] || []) {
    if (la.found.includes(wi) || la.pending[wi]) continue;
    const w = pub.words[wi], letters = w.cells.map((c) => la.val[c] || '').join('');
    if (letters.length !== w.len || la.tried[wi] === letters) continue;
    la.pending[wi] = true; la.tried[wi] = letters;
    socket.emit('cw', { wi, letters }, (r) => {
      la.pending[wi] = false;
      if (!r) return;
      if (r.ok) {
        if (!la.found.includes(wi)) la.found.push(wi);
        la.solved = r.solved; la.done = r.done; la.rank = r.rank; haptic('heavy');
        if (la.done) return render(true);
        cwHL();
      } else cwFlash(w.cells);
    });
  }
}
function cwMove(k, d) {
  const w = S.act.pub.words[la.aw], nk = w.cells[w.cells.indexOf(k) + d];
  if (!nk) return null;
  const el = app.querySelector(`input[data-k="${nk}"]`); if (el) el.focus();
  return nk;
}
const cwLocked = (k) => la.found.some((i) => S.act.pub.words[i].cells.includes(k));
function cwSelect(wi) {
  la.aw = wi; const w = S.act.pub.words[wi];
  const k = w.cells.find((c) => !la.val[c]) || w.cells[0];
  const el = app.querySelector(`input[data-k="${k}"]`); if (el) el.focus();
  cwHL();
}
app.addEventListener('focusin', (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k || !la || la.type !== 'cw') return;
  const ws = la.cellWords[k]; if (!ws.includes(la.aw)) la.aw = ws.find((i) => !la.found.includes(i)) ?? ws[0];
  cwHL();
});
app.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k || !la || la.type !== 'cw') return;
  const v = (e.target.value || '').toUpperCase().replace(/[^A-Z]/g, '').slice(-1);
  if (cwLocked(k)) { e.target.value = la.val[k]; if (v) cwMove(k, 1); return; }  // topilgan harf o'zgarmaydi
  e.target.value = v; la.val[k] = v;
  cwTry(k);
  if (v) cwMove(k, 1);
});
app.addEventListener('keydown', (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k || !la || la.type !== 'cw') return;
  if (e.key === 'Backspace' && !e.target.value) {
    e.preventDefault();
    const nk = cwMove(k, -1);
    if (nk && !cwLocked(nk)) { const el = app.querySelector(`input[data-k="${nk}"]`); if (el) { el.value = ''; la.val[nk] = ''; } }
  }
});
/* juftlik */
function vMatch() {
  if (la.done) return actHead() + doneCard(`${la.mist} ta xato bilan hammasini moslashtirdingiz`);
  const pub = S.act.pub;
  const cls = (side, id) => [(side === 'L' ? la.okL : la.okR).includes(id) ? 'ok' : '', (side === 'L' ? la.sl : la.sr) === id ? 'sel' : '', la.bad && la.bad[side === 'L' ? 0 : 1] === id ? 'bad' : ''].join(' ');
  return `${actHead()}
  <p class="muted center tiny">Chapdagi atamani bosing, so'ng o'ngdagi ta'rifini tanlang</p>
  <div class="match">
    <div class="mcol">${pub.left.map((x) => `<button class="mi ${cls('L', x.id)}" onclick="matchPick('L',${x.id})">${esc(x.t)}</button>`).join('')}</div>
    <div class="mcol">${pub.right.map((x) => `<button class="mi ${cls('R', x.id)}" onclick="matchPick('R',${x.id})">${esc(x.t)}</button>`).join('')}</div>
  </div>`;
}
function matchPick(side, id) {
  if (la.busy || la.bad) return;
  if ((side === 'L' ? la.okL : la.okR).includes(id)) return;
  haptic('light');
  if (side === 'L') la.sl = la.sl === id ? -1 : id; else la.sr = la.sr === id ? -1 : id;
  if (la.sl >= 0 && la.sr >= 0) {
    const l = la.sl, r = la.sr; la.busy = true;
    socket.emit('match', { l, r }, (res) => {
      la.busy = false;
      if (res && res.ok) { la.okL.push(l); la.okR.push(r); la.solved = res.solved; la.done = res.done; la.rank = res.rank; la.sl = la.sr = -1; haptic('heavy'); render(true); }
      else { la.bad = [l, r]; la.mist++; render(true); setTimeout(() => { la.bad = null; la.sl = la.sr = -1; render(true); }, 650); }
    });
  }
  render(true);
}
/* saralash */
function vSort() {
  const pub = S.act.pub, n = pub.items.length;
  const next = (() => { for (let k = 0; k < n; k++) if (!la.sorted[k]) return k; return -1; })();
  const k = la.fb ? la.cur : next;
  if (k < 0) return actHead() + doneCard(`${la.solved} / ${la.total} to'g'ri ajratdingiz`);
  const answered = Object.keys(la.sorted).length;
  return `${actHead()}
  <p class="muted center">${Math.min(answered + (la.fb ? 0 : 1), n)} / ${n} · Bu kimning vazifasi?</p>
  <div class="card sortitem ${la.fb ? (la.fb.ok ? 'ok' : 'no') : ''}"><div><div>${esc(pub.items[k])}</div>
    ${la.fb ? `<div class="fb">${la.fb.ok ? "✅ To'g'ri!" : '❌ Bu — ' + esc(pub.buckets[la.fb.correct].t) + 'ning vazifasi'}</div>` : ''}</div></div>
  <div class="buckets">${pub.buckets.map((b, i) => `<button class="bucket b${i}" onclick="sortPick(${i})" ${la.fb ? 'disabled' : ''}><span class="bi">${b.i}</span>${esc(b.t)}</button>`).join('')}</div>`;
}
function sortPick(b) {
  if (la.busy || la.fb) return;
  const n = S.act.pub.items.length; let k = -1;
  for (let i = 0; i < n; i++) if (!la.sorted[i]) { k = i; break; }
  if (k < 0) return;
  la.busy = true;
  socket.emit('sort', { k, b }, (r) => {
    la.busy = false; if (!r || (!r.ok && r.correct === undefined)) return;
    la.sorted[k] = { b, ok: r.ok }; la.cur = k; la.fb = { ok: r.ok, correct: r.correct };
    la.solved = r.solved; la.done = r.done; la.rank = r.rank; haptic(r.ok ? 'heavy' : 'light');
    render(true);
    setTimeout(() => { la.fb = null; render(true); }, 1100);
  });
}
/* ketma-ketlik */
function vOrder() {
  const seqs = S.act.pub.seqs;
  if (la.si >= seqs.length) return actHead() + doneCard(`${la.solved} / ${la.total} ta bosqich to'g'ri joyda`);
  const s = seqs[la.si], res = la.res[la.si];
  const head = `${actHead()}<div class="card"><span class="badge">Jarayon ${la.si + 1} / ${seqs.length}</span><h2 style="margin-top:10px;font-size:18px">${esc(s.title)}</h2></div>`;
  if (res) {
    const last = la.si + 1 >= seqs.length;
    return `${head}
    <div class="sec">Sizning tartibingiz</div>
    <div class="olist">${res.ids.map((k, pos) => `<div class="oitem static ${res.res[pos] ? 'ok' : 'no'}"><span class="on">${pos + 1}</span>${esc(s.items[k])}</div>`).join('')}</div>
    ${res.res.every(Boolean) ? '' : `<div class="sec">To'g'ri tartib</div><div class="olist">${res.correct.map((k, pos) => `<div class="oitem static ok"><span class="on">${pos + 1}</span>${esc(s.items[k])}</div>`).join('')}</div>`}
    <button class="btn" onclick="ordNext()">${last ? 'Tugatish 🏁' : 'Keyingi jarayon ➜'}</button>`;
  }
  const pool = s.items.map((t, k) => k).filter((k) => !la.pick.includes(k));
  return `${head}
  <p class="muted center tiny">Bosqichlarni to'g'ri tartibda bosing. Xato bossangiz — yuqoridagidan bosib qaytaring.</p>
  <div class="sec">Sizning tartibingiz</div>
  <div class="olist">${la.pick.map((k, pos) => `<button class="oitem" onclick="ordPick(${k})"><span class="on">${pos + 1}</span>${esc(s.items[k])}</button>`).join('') || '<div class="slot">Pastdan birinchi bosqichni tanlang</div>'}</div>
  ${pool.length ? `<div class="sec">Bosqichlar</div><div class="olist">${pool.map((k) => `<button class="oitem pool" onclick="ordPick(${k})"><span class="on">+</span>${esc(s.items[k])}</button>`).join('')}</div>` : ''}
  <button class="btn green" ${pool.length ? 'disabled' : ''} onclick="ordCheck()">Tekshirish ✔</button>`;
}
function ordPick(k) { if (la.busy) return; la.pick = la.pick.includes(k) ? la.pick.filter((x) => x !== k) : la.pick.concat(k); haptic('light'); render(true); }
function ordCheck() {
  if (la.busy) return; la.busy = true;
  socket.emit('order', { si: la.si, ids: la.pick }, (r) => {
    la.busy = false; if (!r || !r.ok) return;
    la.res[la.si] = { ids: r.ids, res: r.res, correct: r.correct };
    la.solved = r.solved; la.done = r.done; la.rank = r.rank; haptic('heavy'); render(true);
  });
}
function ordNext() { la.si++; la.pick = []; render(true); window.scrollTo(0, 0); }
function sActivity() {
  if (!meP()) return sLobby();
  if (!la || la.key !== S.act.key) initLa();
  return ({ cw: vCW, match: vMatch, sort: vSort, order: vOrder })[la.type]();
}

/* ================= Ko'priklar va To'siqlar ================= */
const groupMembers = (gi) => S.players.filter((p) => S.cs.groups[p.id] === gi);
function caseCard() {
  return `<div class="card pop">
    <div class="row between" style="margin-bottom:10px"><span class="badge">🌉 Keys ${S.cs.ci + 1} / ${S.cs.n}</span></div>
    <div class="casetxt">${esc(S.cs.text)}</div></div>`;
}
function groupBox(gi, teacher) {
  const G = S.cs.G[gi], mem = groupMembers(gi), win = S.cs.winner === gi;
  const answers = mem.filter((p) => S.cs.ans[p.id] && !S.cs.ans[p.id].hidden).sort((x, y) => S.cs.ans[x.id].sec - S.cs.ans[y.id].sec);
  const cnt = mem.filter((p) => S.cs.ans[p.id]).length;
  return `<div class="grp ${win ? 'win' : ''}">
    <div class="gh" style="background:${G.c}"><span>${G.i} ${esc(G.n)}${win ? ' 🏆' : ''}</span><span class="tiny">${cnt}/${mem.length} javob</span></div>
    <div class="gb">
      <div class="chips" style="justify-content:flex-start">${mem.map((p) => `<span class="chip ${p.on ? '' : 'off'}" style="padding:4px 10px;font-size:13px">${S.cs.ans[p.id] ? '✅' : '⏳'} ${esc(p.name)}</span>`).join('') || `<span class="muted tiny">A'zo yo'q</span>`}</div>
      ${answers.map((p) => `<div class="ans"><b>${esc(p.name)}</b> <span class="muted tiny">· ${S.cs.ans[p.id].sec}s</span><br>${esc(S.cs.ans[p.id].text)}</div>`).join('')}
      ${teacher && S.phase === 'case' ? `<button class="btn sm" style="margin-top:12px;width:100%;background:${G.c};box-shadow:0 3px 0 rgba(0,0,0,.2)" onclick="emit('winner',{g:${gi}})">🏆 G'olib deb belgilash</button>` : ''}
    </div></div>`;
}
function winBanner() {
  const G = S.cs.G[S.cs.winner];
  return `<div class="result pop" style="background:${G.c}"><div class="big">👏</div>
    <h1 style="margin-top:8px">G'olib: ${esc(G.n)}!</h1>
    <p style="font-weight:700;margin-top:6px;opacity:.9">Olqishlar! Guruh a'zolari +1000 ball oladi</p></div>`;
}
function tCase() {
  return `${topBar()}${caseCard()}
  <p class="hint">Har bir guruh o'z vazifasi bo'yicha yechim yozadi. Eng tezkor, psixologik jihatdan to'g'ri va ijodiy yechim topgan guruhni tanlang.</p>
  ${[0, 1, 2].map((gi) => groupBox(gi, true)).join('')}`;
}
function tCaseWin() {
  return `${topBar()}${winBanner()}${[0, 1, 2].map((gi) => groupBox(gi, true)).join('')}
  <div class="card"><h2 style="margin-bottom:10px">🏆 Reyting</h2>${leaderboard(5)}</div>
  <button class="btn green" onclick="emit('next')">${S.cs.ci + 1 >= S.cs.n ? 'Yakuniy natijalar 🎉' : 'Keyingi keys ➜'}</button>`;
}
function sCase() {
  const gi = S.cs.groups[S.me];
  if (gi === undefined || !meP()) return sLobby();
  const G = S.cs.G[gi], mine = S.cs.ans[S.me];
  const mates = groupMembers(gi).filter((p) => p.id !== S.me).map((p) => esc(p.name)).join(', ');
  return `${topBar()}
  <div class="result pop" style="background:${G.c};padding:18px"><div style="font-size:40px">${G.i}</div>
    <h2 style="margin-top:4px">Siz «${esc(G.n)}» guruhidasiz</h2>
    <p class="tiny" style="font-weight:700;opacity:.9;margin-top:4px">${mates ? 'Guruhdoshlar: ' + mates : "Guruhdoshlar hali yo'q"}</p></div>
  ${caseCard()}
  <div class="card"><div class="sec" style="margin-top:0">Sizning vazifangiz</div><div class="task" style="border-color:${G.c}">${esc(G.task)}</div></div>
  ${mine ? `<div class="result wait pop"><div class="big">📨</div><h2 style="margin-top:8px">Javobingiz yuborildi!</h2><p class="tiny" style="font-weight:700;opacity:.9;margin-top:6px">Admin g'olib guruhni tanlashini kuting</p></div>
     <div class="card"><div class="ans" style="margin:0">${esc(mine.text)}</div></div>`
   : `<div class="card"><textarea id="caseTxt" class="field" placeholder="Guruhingiz nomidan yechimingizni yozing…" maxlength="800"></textarea>
     <button class="btn" style="margin-top:10px;background:${G.c};box-shadow:0 4px 0 rgba(0,0,0,.2)" onclick="sendCase()">Yuborish 📨</button></div>`}`;
}
function sendCase() {
  const el = $('#caseTxt'), t = el ? el.value.trim() : '';
  if (!t) { if (el) el.focus(); return; }
  haptic('heavy');
  socket.emit('case', { text: t }, (r) => { if (r && r.ok) { S.cs.ans[S.me] = { text: t, sec: 0 }; render(true); } });
}
function sCaseWin() {
  const p = meP(), win = S.cs.groups[S.me] === S.cs.winner;
  return `${topBar()}${winBanner()}
  <div class="card center"><p class="muted">${win ? "Sizning guruhingiz g'olib! 🥳" : 'Keyingi safar albatta! 💪'}</p>
    <div class="count" style="margin-top:6px">${p ? p.score : 0}</div><p class="muted">jami ball${p && p.last ? ` · +${p.last}` : ''}</p></div>
  ${groupBox(S.cs.winner, false)}
  <p class="hint">Admin keyingi keysni ochishini kuting…</p>`;
}

/* ================= So'z buluti ================= */
const CLOUD_COLORS = ['#5B47E0', '#E5484D', '#2F7CF6', '#1F9D55', '#E39B00', '#C2417A', '#0E8A8A'];
function cloudHTML() {
  const w = S.cloud.words; if (!w.length) return `<div class="cloud"><span class="muted" style="font-weight:600">Javoblar shu yerda paydo bo'ladi…</span></div>`;
  const max = w[0][1]; const arr = [];
  w.forEach((x, i) => (i % 2 ? arr.unshift(x) : arr.push(x)));
  return `<div class="cloud">${arr.map(([t, c], i) => `<span style="font-size:${15 + Math.round(27 * c / max)}px;color:${CLOUD_COLORS[i % CLOUD_COLORS.length]}" title="${c}">${esc(t)}${c > 1 ? `<sup class="tiny" style="opacity:.6"> ${c}</sup>` : ''}</span>`).join('')}</div>`;
}
function cloudHead() {
  return `<div class="card pop"><span class="badge">☁️ Savol ${S.cloud.pi + 1} / ${S.cloud.n}</span><div class="qtext" style="margin-top:10px">${esc(S.cloud.prompt)}</div></div>`;
}
function tCloud() {
  const on = online().length;
  return `${topBar()}${cloudHead()}
  <div class="card">${cloudHTML()}
    <div class="row between" style="margin-top:8px"><b>Javob berdi</b><b>${S.cloud.total} / ${on}</b></div>
    <div class="bar" style="margin-top:6px"><i style="width:${on ? S.cloud.total / on * 100 : 0}%"></i></div></div>
  <button class="btn green" onclick="emit('next')">${S.cloud.pi + 1 >= S.cloud.n ? 'Yakunlash 🎉' : 'Keyingi savol ➜'}</button>`;
}
function sCloud() {
  if (!meP()) return sLobby();
  if (S.cloud.mine) return `${topBar()}${cloudHead()}
    <div class="card center"><p class="muted">Sizning javobingiz</p><h2 style="margin-top:4px">«${esc(S.cloud.mine)}»</h2></div>
    <div class="card"><div class="sec" style="margin-top:0">Guruh fikrlari</div>${cloudHTML()}</div>`;
  return `${topBar()}${cloudHead()}
  <div class="card"><input id="cloudTxt" class="field" maxlength="30" placeholder="Javobingiz…" onkeydown="if(event.key==='Enter')sendCloud()">
  <button class="btn" style="margin-top:10px" onclick="sendCloud()">Yuborish</button></div>`;
}
function sendCloud() {
  const el = $('#cloudTxt'), t = el ? el.value.trim() : ''; if (!t) { if (el) el.focus(); return; }
  haptic('heavy');
  socket.emit('cloud', { text: t }, (r) => { if (r && r.ok) { S.cloud.mine = r.word; render(true); } });
}

/* ================= Yakun ================= */
function tEnd() {
  return `${topBar()}
  <div class="center pop"><div style="font-size:56px">🎉</div><h1 style="margin-top:6px">Natijalar</h1><p class="muted" style="margin-top:4px">${esc(S.gi.title)}</p></div>
  <div class="card">${podium()}</div>
  <div class="card"><h2 style="margin-bottom:10px">Barcha natijalar</h2>${leaderboard(100)}</div>
  <button class="btn" onclick="emit('lobby')">🔁 Boshqa o'yin tanlash</button>`;
}
function sEnd() {
  const pos = ranked().findIndex((x) => x.id === S.me) + 1, p = meP();
  return `${topBar()}
  <div class="center pop"><div style="font-size:56px">${pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '🎉'}</div>
  <h1 style="margin-top:6px">${pos > 0 ? pos + "-o'rin" : 'Dars tugadi'}</h1>
  <p class="muted" style="margin-top:4px">${p ? p.score + ' ball · ' : ''}Barakalla! 👏</p></div>
  <div class="card">${podium()}</div>
  <div class="card"><h2 style="margin-bottom:10px">Reyting</h2>${leaderboard(10)}</div>
  <p class="hint">Admin keyingi o'yinni boshlashini kutmoqdamiz…</p>`;
}

/* ================= Taymer ================= */
setInterval(() => {
  if (!S || S.phase !== 'question') return;
  const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  const t = $('#tmr'); if (t) { t.textContent = left; t.classList.toggle('low', left <= 5); }
}, 200);

/* ================= Render ================= */
function viewKey() {
  if (me.role === 'student') {
    // Talaba yozayotgan yoki o'ynayotgan paytda boshqalarning yangilanishi ekranni qayta chizmasin
    if (S.phase === 'activity' && S.act) return 'act|' + S.act.key + '|' + !!meP();
    if (S.phase === 'case' && S.cs && !S.cs.ans[S.me]) return 'case|' + S.cs.ci + '|' + S.cs.groups[S.me];
    if (S.phase === 'cloud' && S.cloud && !S.cloud.mine) return 'cloud|' + S.cloud.pi;
  }
  return 'x' + Math.random();
}
function render(force) {
  netBar();
  if (!me.role) { if (force) app.innerHTML = vLogin(); return; }
  if (!S) { app.innerHTML = `<div class="card center" style="margin-top:40px"><div class="dots"><i></i><i></i><i></i></div><p class="muted">Yuklanmoqda…</p></div>`; return; }
  const k = viewKey(); if (!force && k === lastKey) return; lastKey = k;
  if (S.phase !== 'activity') showKey = S.phase === 'activity' ? showKey : false;
  const T = {
    lobby: tLobby, question: tQuestion, reveal: tReveal, end: tEnd, activity: tActivity, case: tCase, caseWin: tCaseWin, cloud: tCloud,
  };
  const P = {
    lobby: sLobby, question: sQuestion, reveal: sReveal, end: sEnd, activity: sActivity, case: sCase, caseWin: sCaseWin, cloud: sCloud,
  };
  const draft = $('#caseTxt'), dv = draft ? draft.value : '';
  const h = (isT() ? T : P)[S.phase]();
  app.innerHTML = h;
  const nd = $('#caseTxt'); if (nd && dv) nd.value = dv;
}
render(true);
</script>
</body>
</html>
